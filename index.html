<script>
const $=i=>document.getElementById(i),C=CONFIG,D=document,Q=s=>D.querySelectorAll(s);
const ic=(n,c="")=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const ini=s=>s.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
const av=(o,c="")=>`<div class="av ${c}">${o.foto?`<img src="${o.foto}" alt="${o.nama}">`:o.ikon?ic(o.ikon):ini(o.nama)}</div>`;
const sh=(t,p)=>`<div class="sh"><h2>${t}</h2><p>${p}</p></div>`;
const node=n=>`<li><div class="nd">${av(n)}<small>${n.peran}</small><b>${n.nama}</b></div>${n.anak?`<ul>${n.anak.map(node).join("")}</ul>`:""}`;
const slots=a=>Array.from({length:Math.max(10,a.length)},(_,i)=>a[i]);
const tile=(x,i,l,k)=>{const o=typeof x=="string"?{src:x}:x||{},s=o.src||"",n=String(i+1).padStart(2,"0");const m=!s?`<div class="ph">${ic(k)}<span>${l} ${n}</span></div>`:/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(s)?`<video class="album-video" src="${s}" muted playsinline loop preload="metadata" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"${o.poster && !o.poster.startsWith("LINK_")?` poster="${o.poster}"`:""} aria-label="${o.caption||l+" "+n}" tabindex="-1"></video>`:`<img src="${s}" alt="${o.caption||l+" "+n}" loading="lazy">`;return `<figure class="tile">${m}${o.caption?`<figcaption>${o.caption}</figcaption>`:""}</figure>`};

/* ===== VIDEO AUTOPLAY MULUS =====
   Video tersembunyi (opacity 0) sampai benar-benar berputar, lalu muncul pelan.
   Jadi kotak abu-abu + tombol play besar tidak pernah terlihat.
   Kalau browser memblokir, video jalan sendiri saat layar pertama disentuh. */
const BLANK="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
function smooth(v){
  if(!v||v.dataset.smoothed)return v;
  v.dataset.smoothed="1";
  v.muted=true;v.defaultMuted=true;
  v.setAttribute("muted","");v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");
  if(!v.poster)v.poster=BLANK;
  v.dataset.ready="false";
  v.addEventListener("playing",()=>{v.dataset.ready="true"});
  const inView=()=>{const r=v.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth};
  const tryPlay=()=>{if(!v.paused&&!v.ended)return;v.play().catch(()=>{})};
  tryPlay();
  addEventListener("pointerdown",tryPlay,{once:true});
  addEventListener("touchstart",tryPlay,{once:true});
  D.addEventListener("visibilitychange",()=>{if(!D.hidden&&inView())tryPlay()});
  v._tryPlay=tryPlay;
  return v;
}

/* Isi halaman dari CONFIG */
D.title=C.namaKelas;$("nb").textContent=C.namaKelas;
$("it").innerHTML=[...C.namaKelas].map((c,i)=>`<span style="--d:${.25+i*.09}s">${c}</span>`).join("");
if(C.introVideo){const v=$("iv");v.src=C.introVideo;v.load();smooth(v);D.querySelector("#intro .aur").hidden=true;}else{$("iv").hidden=true;}
$("app").insertAdjacentHTML("afterbegin",`<header class="hero">
  <div class="hero-thumbnail${C.thumbnailVideo ? " has-video" : C.thumbnail ? " has-image" : ""}">
    ${C.thumbnailVideo ? `<video class="hero-thumbnail-video" src="${C.thumbnailVideo}" autoplay muted loop playsinline preload="auto" tabindex="-1" aria-label="Video thumbnail 8Dream"></video>` : C.thumbnail ? `<img src="${C.thumbnail}" alt="Thumbnail 8DREAM">` : ""}
    <div class="hero-thumbnail-orbit"></div>
    <div class="hero-thumbnail-content">
      <span>CLASS OF 2026 / 2027</span>
      <h2>8DREAM</h2>
      <p>ONE CLASS · ONE STORY · INFINITE MEMORIES</p>
    </div>
  </div>
  <h1>${C.namaKelas}</h1><p>${C.tagline}</p><small>${C.label}</small><a class="go glass" href="#kelas" aria-label="Turun ke bawah">${ic("down")}</a>
</header>`);
smooth(D.querySelector(".hero-thumbnail-video"));

const W=C.walikelas,IK=["crown","shield","pen","wallet"];
const S=C.struktur.map((o,i)=>({...o,ikon:o.ikon||IK[i]||"users"}));
const root=S[0]&&{...S[0],anak:S[1]?[{...S[1],anak:S.length>2?S.slice(2):null}]:null};
$("kelas").innerHTML=sh("Wali kelas dan pengurus","Orang-orang yang menjaga kelas tetap rapi dan seru.")+
`<div class="bento"><div class="card wk"><div class="top">${av(W,"lg")}<div><span class="chip">${W.jabatan}</span><h3>${W.nama}</h3></div></div>
<div class="rows"><div class="row2">${ic("book")}<div><small>Mata pelajaran</small>${W.mapel}</div></div><div class="row2">${ic("users")}<div><small>Jumlah siswa</small>${W.jumlahSiswa} siswa</div></div></div>
<div class="qt">${ic("quote")}<span>${W.motto}</span></div></div>
<div class="card"><h3 class="th">Struktur kelas</h3><p class="tp">Susunan pengurus dari atas ke bawah.</p><div class="tree">${root?`<ul>${node(root)}</ul>`:""}</div></div></div>`;
$("album").innerHTML=sh("Album Kelas","Foto dan video kenangan kita bersama.")+
`<h3 class="sub">${ic("image")}Foto</h3><div class="grid">${slots(C.foto).map((x,i)=>tile(x,i,"Foto","image")).join("")}</div>
<h3 class="sub">${ic("video")}Video</h3><div class="grid v">${slots(C.video).map((x,i)=>tile(x,i,"Video","video")).join("")}</div>`;
/* Video album otomatis diputar saat masuk layar, berhenti saat keluar layar */
const albumVideos=[...D.querySelectorAll("#album .album-video")];
albumVideos.forEach(smooth);
if("IntersectionObserver" in window){
  const videoObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video=entry.target;
      if(entry.isIntersecting && entry.intersectionRatio>=0.55){video._tryPlay?video._tryPlay():video.play().catch(()=>{})}
      else video.pause();
    });
  },{threshold:[0,0.55,1]});
  albumVideos.forEach(video=>videoObserver.observe(video));
}else{
  albumVideos.forEach(video=>video.play().catch(()=>{}));
}
D.addEventListener("visibilitychange",()=>{
  if(D.hidden) albumVideos.forEach(video=>video.pause());
  else albumVideos.forEach(video=>{
    const r=video.getBoundingClientRect();
    if(r.bottom>0 && r.top<innerHeight) (video._tryPlay?video._tryPlay():video.play().catch(()=>{}));
  });
});

$("credits").innerHTML=`Dibuat dengan ${ic("heart","f")} oleh ${C.credits.map(n=>`<span class="cc">${n}</span>`).join("")}`;

D.addEventListener("click",e=>{const t=e.target;if(t.matches(".tile img")){$("lb").firstElementChild.src=t.src;$("lb").showModal()}});
$("lb").onclick=()=>$("lb").close();$("intro").addEventListener("contextmenu",e=>e.preventDefault());

/* Pemutar lagu */
const au=$("au"),pr=$("player"),L=C.lagu.filter(l=>l.src&&/^https?:|^data:|^blob:|\.(mp3|m4a|aac|ogg|wav|flac)(\?|#|$)/i.test(l.src));let ci=-1,shuf=false;
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const setP=(el,p)=>el.style.setProperty("--p",p+"%");
const cov=l=>l.cover?`url('${l.cover}') center/cover`:"var(--cg)";
const lst=()=>{$("pl").innerHTML=L.length?L.map((l,i)=>`<button class="tr${i==ci?" on":""}" data-i="${i}"><span class="disc" style="--cv:${cov(l)}"></span><span class="tx"><b>${l.judul}</b><small>${l.artis||""}</small></span>${i==ci?'<div class="eq"><i></i><i></i><i></i></div>':""}</button>`).join(""):`<p class="nt">Belum ada lagu. Tambahkan dari perangkat atau isi CONFIG.lagu.</p>`};
const play=i=>{if(!L.length)return;ci=(i+L.length)%L.length;const l=L[ci];au.src=l.src;au.play().catch(()=>{});Q(".tt").forEach(e=>e.textContent=l.judul);Q(".aa").forEach(e=>e.textContent=l.artis||C.namaKelas);pr.style.setProperty("--cv",l.cover?cov(l):"");lst()};
const nxt=()=>play(shuf&&L.length>1?ci+1+Math.floor(Math.random()*(L.length-1)):ci+1);
const ico=n=>Q(".ppi use").forEach(u=>u.setAttribute("href","#i-"+n));
const openPlayer=()=>{pr.classList.add("open");$("mini").inert=true;$("full").inert=false};
const closePlayer=()=>{pr.classList.remove("open");$("mini").inert=false;$("full").inert=true;$("full").firstElementChild.scrollTop=0};
const tog=()=>pr.classList.contains("open")?closePlayer():openPlayer();
["ml","tl"].forEach(i=>$(i).onclick=openPlayer);$("cl").onclick=e=>{e.preventDefault();e.stopPropagation();closePlayer()};
au.onplay=()=>{pr.classList.add("spin");ico("pause")};au.onpause=()=>{pr.classList.remove("spin");ico("play")};
au.onloadedmetadata=()=>$("t2").textContent=fmt(au.duration);
au.ontimeupdate=()=>{const p=au.duration?au.currentTime/au.duration*100:0;$("seek").value=p;setP($("seek"),p);setP($("bar"),p);$("t1").textContent=fmt(au.currentTime)};
au.onended=nxt;$("seek").oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
Q(".pp").forEach(b=>b.onclick=()=>{if(!L.length){if(!pr.classList.contains("open"))tog();return}ci<0?play(0):au.paused?au.play():au.pause()});
$("nx").onclick=nxt;$("pv").onclick=()=>au.currentTime>3?au.currentTime=0:play(ci<=0?L.length-1:ci-1);
$("sf").onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle("on",shuf)};
$("rp").onclick=e=>{au.loop=!au.loop;e.currentTarget.classList.toggle("on",au.loop)};
$("vol").oninput=e=>{au.volume=e.target.value;setP(e.target,e.target.value*100)};setP($("vol"),100);
$("pl").onclick=e=>{const b=e.target.closest(".tr");if(b)play(+b.dataset.i)};
$("up").onchange=e=>{[...e.target.files].forEach(f=>L.push({judul:f.name.replace(/\.[^.]+$/,""),artis:"Lagu tambahan",src:URL.createObjectURL(f)}));ci<0?play(0):lst();e.target.value=""};lst();

/* Ledakan partikel */
function burst(x,y){const c=$("fx"),g=c.getContext("2d"),d=devicePixelRatio||1,cs=getComputedStyle(D.documentElement),cols=["--a","--b","--c","--b"].map(v=>cs.getPropertyValue(v).trim()).concat("#fff");
c.width=innerWidth*d;c.height=innerHeight*d;g.scale(d,d);
const P=Array.from({length:200},()=>{const a=Math.random()*6.283,s=Math.sqrt(Math.random())*14+2;return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*3+1,l:1,k:cols[Math.random()*cols.length|0]}});
(function f(){g.clearRect(0,0,innerWidth,innerHeight);g.globalCompositeOperation="lighter";let alive=false;
P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.18;p.l-=.011;if(p.l>0){alive=true;const r=p.r*p.l+.5;g.fillStyle=p.k;g.globalAlpha=p.l*.22;g.beginPath();g.arc(p.x,p.y,r*3.2,0,6.283);g.fill();g.globalAlpha=p.l;g.beginPath();g.arc(p.x,p.y,r,0,6.283);g.fill()}});
g.globalAlpha=1;alive?requestAnimationFrame(f):g.clearRect(0,0,innerWidth,innerHeight)})();}

/* Sidik jari: tahan 1,5 detik. Lepas lebih awal = batal. */
let busy=false,scanning=false,scanTimer=null;
const fp=$("fp"),intro=$("intro"),gate=$("gate"),st=$("st");
function startScan(e){
  if(busy||scanning)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  scanning=true;
  try{fp.setPointerCapture(e.pointerId)}catch(_){}
  gate.classList.add("scan");
  st.textContent="Memindai sidik jari…";
  scanTimer=setTimeout(finishScan,1500);
}
function cancelScan(){
  if(!scanning||busy)return;
  clearTimeout(scanTimer);scanTimer=null;scanning=false;
  gate.classList.remove("scan");
  st.textContent="Sentuh dan tahan untuk masuk";
}
function finishScan(){
  if(!scanning||busy)return;
  clearTimeout(scanTimer);scanTimer=null;scanning=false;busy=true;
  st.textContent="Akses diterima";
  const r=fp.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  D.body.style.setProperty("--x",x+"px");D.body.style.setProperty("--y",y+"px");
  D.body.classList.add("boom");
  burst(x,y);
  if(C.autoPlayLagu&&L.length)play(0);
  D.body.classList.add("on");
  intro.classList.add("gone");
  setTimeout(()=>{intro.remove();D.body.classList.remove("boom")},900);
}
fp.addEventListener("pointerdown",startScan);
fp.addEventListener("pointerup",cancelScan);
fp.addEventListener("pointercancel",cancelScan);
fp.addEventListener("lostpointercapture",cancelScan);
</script>
